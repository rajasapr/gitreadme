services:
  - type: web
    name: readme-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: COMMIT_BACK
        value: "true"
      - key: DEFAULT_BRANCH
        value: "main"
